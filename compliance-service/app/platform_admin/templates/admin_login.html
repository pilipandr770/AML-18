{% extends "admin_base.html" %}
{% block title %}Operator sign in{% endblock %}
{% block content %}
<div class="panel" style="max-width:420px;margin:40px auto">
  <h2>Operator sign in</h2>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ admin_csrf() }}">
    <label for="email">Email</label><input type="email" id="email" name="email" required autocomplete="username">
    <label for="password">Password</label><input type="password" id="password" name="password" required autocomplete="current-password">
    <label for="code">Authenticator code</label><input type="text" id="code" name="code" inputmode="numeric" required autocomplete="one-time-code">
    <p><button type="submit">Sign in</button></p>
  </form>
</div>
{% endblock %}
