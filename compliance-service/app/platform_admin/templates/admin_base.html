<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Platform admin{% endblock %} – AML+18</title>
  <style>
    :root { --bg:#0f172a; --panel:#fff; --text:#1b1f24; --muted:#5b6572; --border:#e1e4e8; --accent:#2563eb; --ok:#1a7f37; --warn:#b35900; --bad:#b91c1c; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:-apple-system,Segoe UI,Roboto,sans-serif; background:#f1f3f6; color:var(--text); line-height:1.5; }
    header { background:var(--bg); color:#e6e9ef; padding:12px 24px; display:flex; align-items:center; gap:18px; }
    header h1 { font-size:16px; margin:0; } header a { color:#cbd5e1; text-decoration:none; font-size:14px; }
    header form { margin-left:auto; }
    main { max-width:1200px; margin:24px auto; padding:0 24px 48px; }
    .panel { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:18px; margin-bottom:16px; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th,td { text-align:left; padding:7px 9px; border-bottom:1px solid var(--border); vertical-align:top; }
    th { color:var(--muted); font-size:11px; text-transform:uppercase; }
    .badge { display:inline-block; padding:1px 8px; border-radius:999px; font-size:11px; font-weight:600; color:#fff; background:var(--muted); }
    .ok { background:var(--ok); } .warn { background:var(--warn); } .bad { background:var(--bad); } .acc { background:var(--accent); }
    .muted { color:var(--muted); font-size:13px; }
    label { display:block; font-size:13px; font-weight:600; margin:10px 0 4px; }
    input[type=text],input[type=email],input[type=password],select { width:100%; padding:7px; border:1px solid var(--border); border-radius:6px; font-size:14px; }
    button { padding:7px 14px; border:none; border-radius:6px; background:var(--accent); color:#fff; cursor:pointer; font-size:13px; }
    button.danger { background:var(--bad); } button.secondary { background:#fff; color:var(--text); border:1px solid var(--border); }
    .flash { background:#eef3ff; border:1px solid #c7d7fe; padding:9px 13px; border-radius:6px; margin-bottom:12px; font-size:14px; }
    .error { background:#fdecec; border:1px solid #f2b8b8; color:var(--bad); padding:9px 13px; border-radius:6px; margin-bottom:12px; font-size:14px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; }
    .stat { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:12px 14px; } .stat b { display:block; font-size:22px; }
    code { background:#f1f3f5; padding:1px 5px; border-radius:4px; font-size:12px; }
  </style>
</head>
<body>
  <header>
    <h1>AML+18 platform admin</h1>
    {% if g.operator %}<a href="{{ url_for('platform_admin.dashboard') }}">Dashboard</a>
    <span class="muted" style="color:#94a3b8">{{ g.operator.email }}</span>
    <form method="post" action="{{ url_for('platform_admin.logout') }}"><input type="hidden" name="csrf_token" value="{{ admin_csrf() }}"><button class="secondary" type="submit">Sign out</button></form>{% endif %}
  </header>
  <main>
    {% for m in get_flashed_messages() %}<div class="flash">{{ m }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
