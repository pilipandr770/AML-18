<!doctype html>
<html lang="{{ config.UI_LOCALE }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ _("Agent console") }}{% endblock %} – AML+18</title>
  <style>
    :root { --bg:#f7f8fa; --panel:#fff; --text:#1b1f24; --muted:#5b6572; --border:#e1e4e8; --accent:#2563eb;
            --ok:#1a7f37; --warn:#b35900; --bad:#b91c1c; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--text); line-height:1.5; }
    header { background:var(--panel); border-bottom:1px solid var(--border); padding:12px 24px; display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
    header h1 { font-size:16px; margin:0; }
    header nav a { color:var(--muted); text-decoration:none; font-size:14px; margin-right:14px; }
    header nav a:hover { color:var(--accent); }
    .right { margin-left:auto; display:flex; gap:10px; align-items:center; }
    main { max-width:1000px; margin:24px auto; padding:0 24px 48px; }
    .panel { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:20px; margin-bottom:16px; }
    table { width:100%; border-collapse:collapse; font-size:14px; }
    th,td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--border); vertical-align:top; }
    th { color:var(--muted); font-size:12px; text-transform:uppercase; }
    .badge { display:inline-block; padding:2px 9px; border-radius:999px; font-size:12px; font-weight:600; color:#fff; background:var(--muted); }
    .b-clear,.b-monitor,.b-ok { background:var(--ok); } .b-needs_review,.b-awaiting_human { background:var(--warn); }
    .b-recommend_block,.b-bad { background:var(--bad); } .b-operate { background:var(--accent); }
    .muted { color:var(--muted); font-size:13px; }
    label { display:block; font-size:13px; font-weight:600; margin:12px 0 4px; }
    input[type=text],input[type=email],input[type=password],textarea { width:100%; padding:8px; border:1px solid var(--border); border-radius:6px; font-size:14px; font-family:inherit; }
    textarea { font-family:ui-monospace,Consolas,monospace; min-height:260px; }
    button,.btn { padding:8px 16px; border-radius:6px; border:none; background:var(--accent); color:#fff; font-size:14px; cursor:pointer; text-decoration:none; display:inline-block; }
    button.danger { background:var(--bad); } button.secondary { background:#fff; color:var(--text); border:1px solid var(--border); }
    .flash { background:#eef3ff; border:1px solid #c7d7fe; padding:10px 14px; border-radius:6px; margin-bottom:14px; font-size:14px; word-break:break-all; }
    .error { background:#fdecec; border:1px solid #f2b8b8; color:var(--bad); padding:10px 14px; border-radius:6px; margin-bottom:14px; font-size:14px; }
    code { background:#f1f3f5; padding:1px 5px; border-radius:4px; font-size:13px; }
    form.inline { display:inline; }
  </style>
</head>
<body>
  <header>
    <h1>AML+18 {{ _("Agent console") }}</h1>
    {% if g.owner %}
    <nav>
      <a href="{{ url_for('owner.feed') }}">{{ _("Live feed") }}</a>
      <a href="{{ url_for('owner.approvals') }}">{{ _("Pending approvals") }}</a>
      <a href="{{ url_for('owner.policy_page') }}">{{ _("Mode & Policy") }}</a>
      <a href="{{ url_for('owner.reports') }}">{{ _("Reports") }}</a>
      <a href="{{ url_for('owner.digest_html') }}">{{ _("Digest") }}</a>
    </nav>
    <div class="right">
      <form method="post" action="{{ url_for('owner.kill') }}" class="inline">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button class="danger" type="submit">{{ _("Kill switch") }}</button>
      </form>
      <form method="post" action="{{ url_for('owner.logout') }}" class="inline">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button class="secondary" type="submit">{{ _("Sign out") }}</button>
      </form>
    </div>
    {% endif %}
  </header>
  <main>
    {% for m in get_flashed_messages() %}<div class="flash">{{ m }}</div>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
